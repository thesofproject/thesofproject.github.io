;" x1="295.5" x2="440.5" y1="199.186" y2="199.186"/><text fill="#33335B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="111" x="302.5" y="193.377">(2) ops-&gt;prepare()</text><polygon fill="#F05772" points="630,226.892,640,230.892,630,234.892,634,230.892" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="456.5" x2="636" y1="230.892" y2="230.892"/><text fill="#33335B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="97" x="463.5" y="225.083">(3) preparation</text><polygon fill="#F05772" points="306.5,240.892,296.5,244.892,306.5,248.892,302.5,244.892" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="300.5" x2="450.5" y1="244.892" y2="244.892"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="295.5" x2="337.5" y1="276.598" y2="276.598"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="337.5" x2="337.5" y1="276.598" y2="289.598"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="296.5" x2="337.5" y1="289.598" y2="289.598"/><polygon fill="#F05772" points="306.5,285.598,296.5,289.598,306.5,293.598,302.5,289.598" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="120" x="302.5" y="270.789">alloc buf descriptors</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="295.5" x2="337.5" y1="321.304" y2="321.304"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="337.5" x2="337.5" y1="321.304" y2="334.304"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="296.5" x2="337.5" y1="334.304" y2="334.304"/><polygon fill="#F05772" points="306.5,330.304,296.5,334.304,306.5,338.304,302.5,334.304" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="72" x="302.5" y="315.495">alloc buffers</text><!--MD5=[62458b7b656c9544945d101f4aa57789]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
actor pipeline
box "Module Adapter\no- - comp_ops"
	participant "module_adapter" as module_adapter
end box
box "IADK Module Adapter\no- - module_interface"
	participant "iadk_adapter" as iadk_adapter
end box
box "IADK Module\no- - ProcessingModuleInterface"
	participant iadk_module
end box

pipeline -> module_adapter : <b>(1) ops->module_adapter_prepare()</b>
	activate module_adapter
	module_adapter -> module_adapter : module_prepare()
		activate module_adapter
		module_adapter -> iadk_adapter : <b>(2) ops->prepare()</b>
			activate iadk_adapter
			iadk_adapter -> iadk_module : <b>(3) preparation</b>
		module_adapter <- - iadk_adapter
		deactivate iadk_adapter
		module_adapter -> module_adapter : alloc buf descriptors
		module_adapter -> module_adapter : alloc buffers

@enduml

