="28" y="254.201">alt</text><text fill="#33335B" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="114" x="91" y="253.0629">[if D0ix is still locked]</text><polygon fill="#F05772" points="63,301.4221,53,305.4221,63,309.4221,59,305.4221" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="57" x2="359" y1="305.4221" y2="305.4221"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="82" x="69" y="299.6131">return ERROR</text><path d="M375,264.01 L375,327.01 L652,327.01 L652,274.01 L642,264.01 L375,264.01 " fill="#F6ED80" filter="url(#f12n1cpgzpjglx)" style="stroke: #D6D6DE; stroke-width: 1.0;"/><path d="M642,264.01 L642,274.01 L652,274.01 L642,264.01 " fill="#F6ED80" style="stroke: #D6D6DE; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="256" x="381" y="282.907">Zephyr PM Policy can be used concurrently</text><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="219" x="381" y="300.6131">and there can be more then one lock</text><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="78" x="381" y="318.3191">on D0ix state</text><line style="stroke: #A1A1CA; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="13" x2="666" y1="337.1281" y2="337.1281"/><polygon fill="#F05772" points="63,357.8341,53,361.8341,63,365.8341,59,361.8341" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="57" x2="359" y1="361.8341" y2="361.8341"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="95" x="69" y="356.0251">return SUCCESS</text><!--MD5=[c30e6ad22d122936c15fc274240aa8d3]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4

box "Host" #LightSkyBlue
	participant "driver" as driver
end box

box "SOF" #LightBlue
	participant "Core #0: Zephyr lib" as sof_zephyr_lib
	participant "Zephyr Power Manager" as zephyr_power_manager
end box

driver -> sof_zephyr_lib: SET_D0ix(prevent_power_gating = 0) IPC request
activate sof_zephyr_lib
	sof_zephyr_lib -> zephyr_power_manager: pm_policy_state_lock_put\n(PM_STATE_RUNTIME_IDLE)
		activate zephyr_power_manager
		return
	sof_zephyr_lib -> zephyr_power_manager: pm_policy_state_lock_is_active\n(PM_STATE_RUNTIME_IDLE)
		activate zephyr_power_manager
		return

	alt if D0ix is still locked
		sof_zephyr_lib - -> driver: return ERROR
		note right: Zephyr PM Policy can be used concurrently\nand there can be more then one lock\non D0ix state
	else
		sof_zephyr_lib - -> driver: return SUCCESS
	end

	deactivate sof_zephyr_lib
@enduml

