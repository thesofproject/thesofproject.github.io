@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
left to right direction
 
package pipeline2{
    (LL3)  #f6ed80
    rectangle "BUF3\n\n0ms of data\n" as buf3 
    (DP2)  #ADD1B2
    note bottom of DP2
        period 5ms
        LPT: 1ms
    end note
    rectangle "BUF4\n\n0ms of data\n" as buf4 
    (LL4)  #f6ed80
}

package pipeline1{
    (LL1) #f6ed80
    rectangle "BUF1\n\n10ms of data\n" as buf1
    (DP1) #ADD1B2
    note bottom of DP1
        period 10ms
        LPT:  8ms
    end note
    rectangle "BUF2\n\n10ms of data\n" as buf2 
    (LL2)  #f6ed80
 }

LL1 - -> buf1
buf1 - -> DP1
DP1 - -> buf2
buf2 - -> LL2

LL3 - -> buf3
buf3 - -> DP2
DP2 - -> buf4
buf4 - -> LL4

@enduml

