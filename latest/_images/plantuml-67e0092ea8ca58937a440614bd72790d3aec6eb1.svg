6" y="243.0748">true</text><line style="stroke: #F05772; stroke-width: 0.7497656982193065;" x1="340.3936" x2="371.8838" y1="274.9511" y2="274.9511"/><line style="stroke: #F05772; stroke-width: 0.7497656982193065;" x1="371.8838" x2="371.8838" y1="274.9511" y2="284.6981"/><line style="stroke: #F05772; stroke-width: 0.7497656982193065;" x1="336.6448" x2="371.8838" y1="284.6981" y2="284.6981"/><polygon fill="#F05772" points="344.1425,281.699,336.6448,284.6981,344.1425,287.6971,341.1434,284.6981" style="stroke: #F05772; stroke-width: 0.7497656982193065;"/><text fill="#33335B" font-family="sans-serif" font-size="9.747" lengthAdjust="spacingAndGlyphs" textLength="54.7329" x="345.642" y="270.5957">d0-idle state</text><polygon fill="#F05772" points="134.5829,288.4469,127.0853,291.446,134.5829,294.445,131.5839,291.446" style="stroke: #F05772; stroke-width: 0.7497656982193065;"/><line style="stroke: #F05772; stroke-width: 0.7497656982193065; stroke-dasharray: 2.0,2.0;" x1="130.0843" x2="196.4386" y1="291.446" y2="291.446"/><polygon fill="#F05772" points="36.3636,298.9436,28.866,301.9427,36.3636,304.9417,33.3646,301.9427" style="stroke: #F05772; stroke-width: 0.7497656982193065;"/><line style="stroke: #F05772; stroke-width: 0.7497656982193065; stroke-dasharray: 2.0,2.0;" x1="31.865" x2="125.5858" y1="301.9427" y2="301.9427"/><!--MD5=[5b92723ea782bf8f7584445b16f64ef0]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
scale max 800 width

participant drv as "Driver"
participant ipc
participant mct as "master-core-task"
participant platform
participant pm_rt as "pm-runtime"

mct -> platform : platform_init()
   activate platform

   platform -> pm_rt :<b> pm_runtime_disable(PM_RUNTIME_DSP, 0)</b>
      activate pm_rt
      note right: Make latency of dsp core 0 int handler minimal
      pm_rt -> pm_rt : ref_cnt++
         note right: 0 -> 1
   platform <- - pm_rt
   deactivate pm_rt

mct <- - platform
deactivate platform

drv -> ipc : building topology
   ipc -> mct
      mct -> platform : <i>platform_wait_for_interrupt()</i>
         activate platform
         platform -> pm_rt : <b>pm_runtime_is_active(PM_RUNTIME_DSP, 0)</b>
            activate pm_rt
         platform <- - pm_rt : true
         deactivate pm_rt
         platform -> platform : d0-idle state
         deactivate platform
   ipc <- - mct
drv <- - ipc

@enduml

