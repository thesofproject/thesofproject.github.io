/><line style="stroke: #F05772; stroke-width: 1.0;" x1="546.5" x2="587.5" y1="347.716" y2="347.716"/><polygon fill="#F05772" points="556.5,343.716,546.5,347.716,556.5,351.716,552.5,347.716" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="99" x="552.5" y="328.907">parse_manifest()</text><path d="M663,317.51 L663,344.51 L912,344.51 L912,327.51 L902,317.51 L663,317.51 " fill="#F6ED80" filter="url(#f1r8hlufnbousx)" style="stroke: #D6D6DE; stroke-width: 1.0;"/><path d="M902,317.51 L902,327.51 L912,327.51 L902,317.51 " fill="#F6ED80" style="stroke: #D6D6DE; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="228" x="669" y="336.407">copying of FW IMR -&gt; SRAM done here</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="545.5" x2="592.5" y1="381.4221" y2="381.4221"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="592.5" x2="592.5" y1="381.4221" y2="394.4221"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="551.5" x2="592.5" y1="394.4221" y2="394.4221"/><polygon fill="#F05772" points="561.5,390.4221,551.5,394.4221,561.5,398.4221,557.5,394.4221" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="86" x="557.5" y="375.6131">_ResetVector()</text><polygon fill="#F05772" points="755.5,427.1281,765.5,431.1281,755.5,435.1281,759.5,431.1281" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="550.5" x2="761.5" y1="431.1281" y2="431.1281"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="193" x="557.5" y="425.3191">_MainEntry() @SOF_TEXT_START</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="767.5" x2="814.5" y1="457.8341" y2="457.8341"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="814.5" x2="814.5" y1="457.8341" y2="470.8341"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="773.5" x2="814.5" y1="470.8341" y2="470.8341"/><polygon fill="#F05772" points="783.5,466.8341,773.5,470.8341,783.5,474.8341,779.5,470.8341" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="63" x="779.5" y="452.0251">call0 _start</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="772.5" x2="819.5" y1="502.5401" y2="502.5401"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="819.5" x2="819.5" y1="502.5401" y2="515.5401"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="778.5" x2="819.5" y1="515.5401" y2="515.5401"/><polygon fill="#F05772" points="788.5,511.5401,778.5,515.5401,788.5,519.5401,784.5,515.5401" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="52" x="784.5" y="496.7311">call main</text><!--MD5=[c945b129cd88296976c049b089186d47]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
actor "ROM" as rom
box "boot_ldr @IMR" #6fccdd
	participant ".boot_entry.text" as bup_be
	participant ".text" as bup
end box
participant "sof" as fw

rom -> bup_be : boot_entry() @boot_ldr.ep (boot_entry.S)
	activate bup_be
	bup_be -> bup_be : j boot_init:
	note right: Platform specific actions (compilation flags)\n- reset MHE\n- disable L2$
	bup_be -> bup : call8 boot_pri_core() (boot_loader.c)
		activate bup
		bup -> bup : hp_sram_init()
		opt defined(CONFIG_BOOT_LOADER)
			bup -> bup : parse_manifest()
			note right: copying of FW IMR -> SRAM done here
		end

	bup -> bup : _ResetVector()
		activate bup
		bup -> fw : _MainEntry() @SOF_TEXT_START
			fw -> fw : call0 _start
				activate fw
				fw -> fw : call main
					activate fw

@enduml

