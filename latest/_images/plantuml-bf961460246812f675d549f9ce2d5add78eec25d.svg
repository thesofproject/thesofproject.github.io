@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
left to right direction
(LL1) as mod1 #f6ed80

rectangle "BUF1\n\n14ms of data\n" as buf1
note bottom of buf1
  there was 109ms
  LL1 produced 5ms
  DP1 consumed 100ms
  109+5-100 = 14ms
end note

(DP1) as mod2 #ADD1B2

note bottom of mod2
  period 100ms
  LPT:  5ms
end note

rectangle "BUF2\n\n100ms of data\n" as buf2

(DP2) as mod3 #ADD1B2

note bottom of mod3
  period 10ms
  LPT:  9ms
end note

rectangle "BUF3\n\n11ms of data\n" as buf3

(LL2) as mod4 #f6ed80


mod1- -> buf1
buf1 - -> mod2
mod2- ->buf2
buf2 - -> mod3
mod3- ->buf3
buf3 - -> mod4
@enduml 

