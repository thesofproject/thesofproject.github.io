" y1="510.5401" y2="510.5401"/><polygon fill="#F05772" points="301.5,506.5401,291.5,510.5401,301.5,514.5401,297.5,510.5401" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="207" x="297.5" y="491.7311">module_adapter_process_output()</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="290.5" x2="332.5" y1="569.9521" y2="569.9521"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="332.5" x2="332.5" y1="569.9521" y2="582.9521"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="285.5" x2="332.5" y1="582.9521" y2="582.9521"/><polygon fill="#F05772" points="295.5,578.9521,285.5,582.9521,295.5,586.9521,291.5,582.9521" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="200" x="297.5" y="546.4371">copy output from internal buffers</text><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="43" x="297.5" y="564.1431">tosinks</text><polygon fill="#F05772" points="66.5,587.9521,56.5,591.9521,66.5,595.9521,62.5,591.9521" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="60.5" x2="274.5" y1="591.9521" y2="591.9521"/><!--MD5=[6565d2a1d9eaf836eb5ec39a43a00f03]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
actor pipeline
box "Module Adapter\no- - comp_ops"
	participant "module_adapter" as module_adapter
end box
box "IADK Module Adapter\no- - module_interface"
	participant "iadk_adapter" as iadk_adapter
end box
box "IADK Module\no- - ProcessingModuleInterface"
	participant iadk_module
end box

pipeline -> module_adapter : <b>(1) ops->module_adapter_copy()</b>
	activate module_adapter

	module_adapter -> module_adapter : find min bytes\nto process

	note left of module_adapter
	This logic is WRONG for some modules!!
	end note

	module_adapter -> module_adapter : copy input from sources\nto internal buffers

	module_adapter -> module_adapter : module_process()
		activate module_adapter
note left of module_adapter
Why all those extra internal calls
used only once??
end note

		module_adapter -> iadk_adapter : <b>(2) ops->process()</b>
			activate iadk_adapter
			iadk_adapter -> iadk_module : <b>(3) processing</b>
		module_adapter <- - iadk_adapter
		deactivate iadk_adapter

	deactivate module_adapter

	module_adapter -> module_adapter : module_adapter_process_output()
		activate module_adapter
		module_adapter -> module_adapter : copy output from internal buffers\ntosinks
	deactivate module_adapter
pipeline <- - module_adapter

@enduml

