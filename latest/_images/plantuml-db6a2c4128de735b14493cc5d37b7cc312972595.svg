phs" textLength="55" x="71" y="401.5448">callback()</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="54" x2="96" y1="439.0598" y2="439.0598"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="96" x2="96" y1="439.0598" y2="452.0598"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="55" x2="96" y1="452.0598" y2="452.0598"/><polygon fill="#F05772" points="65,448.0598,55,452.0598,65,456.0598,61,452.0598" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="249" x="61" y="433.2508">comp_update_buffer_produce/consume()</text><polygon fill="#F05772" points="305,462.0598,315,466.0598,305,470.0598,309,466.0598" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="49" x2="311" y1="466.0598" y2="466.0598"/><polygon fill="#F05772" points="676,493.7659,686,497.7659,676,501.7659,680,497.7659" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="322" x2="682" y1="497.7659" y2="497.7659"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="214" x="329" y="491.9569">1MS_TIMEOUT (to re-arm the timer)</text><!--MD5=[523c57a30e4b74fac48274204623cfc6]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
actor client as "dai\ncomponent"
participant hda_dma
participant work_queue

client -> hda_dma : dma_start()
	activate hda_dma
	note right: GEN := 1 -> transfer starts

	hda_dma -> work_queue : work_schedule_default(&hda_work, HDA_LINK_1MS_US)
	hda_dma <- - work_queue
client <- - hda_dma
deactivate hda_dma

... 1 ms elapsed ...

work_queue -> hda_dma : hda_work->cb()
	activate hda_dma

   hda_dma -> hda_dma : update FPI by 'bytes'
   note right: 'commit' is always true in this scenario

	hda_dma -> hda_dma : wait for next period to be available (w/ short t/o)

	hda_dma -> client : callback()
		activate client
		client -> client : comp_update_buffer_produce/consume()
	hda_dma <- - client
	deactivate client

work_queue <- - hda_dma : 1MS_TIMEOUT (to re-arm the timer)
deactivate hda_dma

@enduml

