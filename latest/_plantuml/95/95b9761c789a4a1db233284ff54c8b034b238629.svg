"#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="61" x="426" y="766.9672">ppl 1 copy</text><line style="stroke: #F05772; stroke-width: 1.0;" x1="419" x2="461" y1="822.4822" y2="822.4822"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="461" x2="461" y1="822.4822" y2="835.4822"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="414" x2="461" y1="835.4822" y2="835.4822"/><polygon fill="#F05772" points="424,831.4822,414,835.4822,424,839.4822,420,835.4822" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="185" x="426" y="816.6732">work_schedule(ppl 1 dai, +1ms)</text><polygon fill="#F05772" points="611,858.1882,621,862.1882,611,866.1882,615,862.1882" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="195" x2="617" y1="862.1882" y2="862.1882"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="100" x="202" y="856.3792">work_set_timer()</text><!--MD5=[f4ca753b2b91a6c02d620635c11bc025]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
participant ipc
participant "core 0" as core_0
participant "core 1" as core_1
participant wallclk

ipc -> core_0 : new pipeline 0 (@core 0)
   activate core_0
   core_0 -> wallclk : timer_register()
   core_0 -> core_0 : work_schedule(ppl 0 dai, +1ms)
   core_0 -> wallclk : work_set_timer(period = +1ms)
ipc <- - core_0
deactivate core_0

wallclk -> core_0 : cb() @ next ms
   activate core_0
   core_0 -> core_0 : ppl 0 dai cb()
      activate core_0
         core_0 -> core_0 : ppl 0 copy
         core_0 -> core_0 : work_schedule(ppl 0 dai, +1ms)
      deactivate core_0
   core_0 -> wallclk : work_set_timer()
   deactivate core_0

ipc -> core_0 : new pipeline 1 (@core 1)
   core_0 -> core_1
   activate core_1
      core_1 -> wallclk : timer_register()
      core_1 -> core_1 : work_schedule(ppl 1 dai)
   core_0 <- - core_1
   deactivate core_1

wallclk -> core_0 : cb() @ next ms
   activate core_0
   activate core_1
   core_0 -> core_0 : ppl 0 dai cb()
      activate core_0
         core_0 -> core_0 : ppl 0 copy
         core_0 -> core_0 : work_schedule(ppl 0 dai, +1ms)
      deactivate core_0
   core_1 -> core_1 : ppl 1 dai cb()
      activate core_1
         core_1 -> core_1 : ppl 1 copy
         core_1 -> core_1 : work_schedule(ppl 1 dai, +1ms)
      deactivate core_1
   deactivate core_1
   core_0 -> wallclk : work_set_timer()
   deactivate core_0

@enduml

