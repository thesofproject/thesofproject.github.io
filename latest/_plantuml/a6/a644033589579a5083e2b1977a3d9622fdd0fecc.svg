; stroke-width: 1.0;" x1="129" x2="170" y1="238.892" y2="238.892"/><polygon fill="#F05772" points="139,234.892,129,238.892,139,242.892,135,238.892" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="191" x="135" y="220.083">pipeline_copy_to_downstream()</text><polygon fill="#F05772" points="14,278.892,4,282.892,14,286.892,10,282.892" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="8" x2="112" y1="282.892" y2="282.892"/><!--MD5=[be39d847a516f37a6881cc2f3bdcfff2]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4
participant "pipeline" as ppl

-> ppl : pipeline_task()
   activate ppl
   ppl -> ppl : pipeline_copy()
      activate ppl
      ppl -> ppl : pipeline_copy_from_upstream()
         activate ppl
         deactivate ppl
      ppl -> ppl : pipeline_copy_to_downstream()
         activate ppl
         deactivate ppl
   deactivate ppl
<- - ppl
deactivate ppl

@enduml

