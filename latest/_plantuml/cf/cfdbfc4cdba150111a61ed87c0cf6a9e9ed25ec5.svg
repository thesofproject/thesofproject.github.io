" y1="151.186" y2="151.186"/><polygon fill="#F05772" points="367,147.186,357,151.186,367,155.186,363,151.186" style="stroke: #F05772; stroke-width: 1.0;"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="126" x="363" y="132.377">increase usage count</text><path d="M257.5,166.186 L324.5,166.186 L324.5,175.186 L314.5,185.186 L257.5,185.186 L257.5,166.186 " fill="#EEEEEE" style="stroke: #A1A1CA; stroke-width: 1.0;"/><rect fill="none" height="65.412" style="stroke: #A1A1CA; stroke-width: 2.0;" width="303.5" x="257.5" y="166.186"/><text fill="#33335B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="22" x="272.5" y="181.083">opt</text><text fill="#33335B" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="75" x="339.5" y="179.9449">[if usage == 1]</text><polygon fill="#F05772" points="484,205.598,494,209.598,484,213.598,488,209.598" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0;" x1="356" x2="490" y1="209.598" y2="209.598"/><text fill="#33335B" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="115" x="363" y="203.789">pm_device_resume</text><polygon fill="#F05772" points="367,219.598,357,223.598,367,227.598,363,223.598" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="361" x2="500" y1="223.598" y2="223.598"/><polygon fill="#F05772" points="149,240.598,139,244.598,149,248.598,145,244.598" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="143" x2="350" y1="244.598" y2="244.598"/><polygon fill="#F05772" points="14,254.598,4,258.598,14,262.598,10,258.598" style="stroke: #F05772; stroke-width: 1.0;"/><line style="stroke: #F05772; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="8" x2="137" y1="258.598" y2="258.598"/><!--MD5=[fdeec362e9c0eb38c1b3106b6b887bad]
@startuml
hidefootbox
skinparam componentStyle uml2

skinparam defaultFontColor	#33335b

skinparam rectangle {
	color		#d6d6de
	backgroundColor	#ffffff
}

skinparam component {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}

skinparam interface {
	backgroundColor	#ffffff
	borderColor	#f05772
}

skinparam class {
	backgroundColor	#ffffff
	borderColor	#33335b
	arrowColor	#f05772
}
skinparam stereotypeCBackgroundColor	#6fccdd

skinparam sequence {
	arrowColor		#4a4a86
	lifeLineBorderColor	#f05772
	groupBorderColor	#a1a1ca
	boxBorderColor		#a1a1ca
	dividerBorderColor	#d6d6de
	dividerBorderThickness	1
}
skinparam participant {
	borderColor		#33335b
	backgroundColor		#ffffff
}
skinparam actor {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam state {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam node {
	backgroundColor		#ffffff
}

skinparam note {
	backgroundColor 	#f6ed80
	borderColor		#d6d6de
}

skinparam activity {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam activityDiamond {
	borderColor		#33335b
	backgroundColor		#ffffff
}

skinparam arrowColor	#f05772
skinparam maxMessageSize 400
skinparam BoxPadding 4

participant "DMIC Manager" as dmic_manager
participant "Zephyr PM Subsystem" as zephyr_pm
participant "DMIC Driver" as dmic_driver

-> dmic_manager : gateway_allocate()
	activate dmic_manager
	dmic_manager -> zephyr_pm : pm_runtime_device_get (dmic)

		activate zephyr_pm
		zephyr_pm -> zephyr_pm : increase usage count
		opt if usage == 1
		zephyr_pm -> dmic_driver : pm_device_resume
			activate dmic_driver
			return
		end
		return

	deactivate dmic_manager
<- - dmic_manager

@enduml

